name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL_MIGRATOR: postgres://isms_migrator:isms_migrator@localhost:5432/isms
      DATABASE_URL: postgres://isms_app:isms_app@localhost:5432/isms
      DATABASE_URL_TEST: postgres://isms_migrator:isms_migrator@localhost:5432/isms_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Datenbank-Rollen anlegen
        run: PGPASSWORD=postgres psql -h localhost -U postgres -f infra/docker/postgres-init.sql
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
