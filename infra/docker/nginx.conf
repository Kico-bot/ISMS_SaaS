# Die Oberfläche wird statisch ausgeliefert, `/api` geht an den API-Dienst im selben Netz.
#
# Beides unter einem Ursprung zu betreiben ist hier keine Bequemlichkeit, sondern Bedingung:
# das Refresh-Cookie ist `SameSite=strict` gesetzt. Läge die Oberfläche auf einem anderen
# Ursprung, schickte der Browser es nie mit und jede Sitzung endete nach 15 Minuten.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # Keine Versionsnummer in Fehlerseiten und im `Server`-Header.
  server_tokens off;

  # Nachweisdateien können groß sein; die Voreinstellung von 1 MB wäre zu knapp.
  client_max_body_size 64m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Nur die Adresse, die nginx selbst sieht. Eine vom Browser mitgeschickte Kette wird
    # verworfen, sonst könnte jeder seine Adresse im Protokoll selbst bestimmen.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Das Auditpaket wird im Datenstrom erzeugt und kann einige hundert Megabyte groß werden.
    proxy_buffering off;
    proxy_read_timeout 600s;
  }

  # Mit Prüfsumme benannte Dateien ändern sich nie — die dürfen lange im Zwischenspeicher liegen.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # Sicherheits-Header (H6). nginx erbt `add_header` nicht in einen Block, der selbst einen
    # setzt; deshalb stehen sie in jedem solchen Block vollständig. Ein Test prüft das.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Einseitenanwendung: jeder unbekannte Pfad ist eine Route der Oberfläche, keine Datei.
  # index.html selbst darf nicht zwischengespeichert werden, sonst zeigt ein Browser nach dem
  # nächsten Aufspielen wochenlang die alte Fassung.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    # Dieselben Sicherheits-Header wie oben. `style-src 'unsafe-inline'` braucht die
    # Druckvorschau: Sie lädt das Druckdokument als `srcdoc` in einen Rahmen, der diese Richtlinie
    # erbt, und das Dokument bringt sein Druck-Stylesheet inline mit. Skripte bleiben verboten.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}
